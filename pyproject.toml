[project]
name = "meeting-intelligence"
version = "0.1.0"
description = "Meeting transcript to project automation pipeline with human-in-the-loop approvals"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",        # local models via Ollama
    "langchain-openai>=0.3.0",        # OpenAI / GPT-4o
    "langchain-anthropic>=0.3.0",     # Anthropic / Claude
    "langchain-google-genai>=2.0.0",  # Google Gemini
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "langgraph-cli[inmem]>=0.4.21",
    "httpx>=0.27.0",                  # Jira REST client
    "fastapi>=0.135.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
server = [
    "langgraph-cli>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    "websockets>=14.0",
]
